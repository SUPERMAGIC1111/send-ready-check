<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Texture Lab</title>
    <style>
      :root { color-scheme: dark; --fg: #f3e6d6; --dim: rgba(243, 230, 214, 0.45); --chip: rgba(255, 255, 255, 0.06); --chip-on: rgba(255, 170, 80, 0.22); }
      html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden; }
      body { font: 12px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
      #stage:active { cursor: grabbing; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; letter-spacing: 0.08em; }
      #ui { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100vw - 32px); }
      #ui button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 999px; background: var(--chip); color: var(--dim); transition: background 0.2s, color 0.2s; }
      #ui button:hover, #ui button:focus-visible { color: var(--fg); outline: 1px solid rgba(255, 255, 255, 0.2); }
      #ui button[aria-pressed="true"] { background: var(--chip-on); color: var(--fg); }
      #top { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: calc(100vw - 32px); pointer-events: none; }
      #picker { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100vw - 32px); }
      #picker button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 999px; background: var(--chip); color: var(--dim); }
      #picker button:hover, #picker button:focus-visible { color: var(--fg); outline: 1px solid rgba(255, 255, 255, 0.2); }
      #picker button[aria-pressed="true"] { background: var(--chip-on); color: var(--fg); }
      #info { color: var(--dim); text-align: center; }
      #ui .sep { width: 1px; background: rgba(255, 255, 255, 0.12); margin: 4px 2px; }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="3D texture lab. Drag to rotate."></canvas>
    <header id="top">
      <nav id="picker" aria-label="Variant"></nav>
      <div id="info" aria-live="polite"></div>
    </header>
    <div id="status">assembling dots…</div>
    <nav id="ui" aria-label="View">
      <button data-view="side" aria-pressed="true" title="Default side view">Side</button>
      <button data-view="three-quarter">45°</button>
      <button data-view="front">Front</button>
      <button data-view="back">Back</button>
      <button data-view="profile">Profile</button>
      <span class="sep"></span>
      <button id="run" title="Space">Run</button>
      <button id="pause" title="P">Pause</button>
      <button id="auto">Orbit</button>
      <span class="sep"></span>
      <button data-mode="dots" aria-pressed="true" title="A">Normal</button>
      <button data-mode="ascii" title="ASCII glyph render mode, EXPERIMENTAL (A)">ASCII (exp.)</button>
    </nav>
    <script type="module" src="./src/lab.js"></script>
  </body>
</html>
